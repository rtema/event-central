  api-worker-01:
    build: api
    command: ["web"]
    container_name: event-central-api-worker-01
    restart: unless-stopped
    environment: 
      <<: *api-env
      API_PORT: 7435
      API_NODE: 01
    secrets: *api-secrets
    ports:
      - "127.0.0.1:7435:7435"
    networks:
      - db-backend
      - storage-backend
      - clamav-backend
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:7435/health').status==200 else 1)\""]
      interval: 10s
      timeout: 3s
      retries: 5
