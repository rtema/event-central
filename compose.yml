  # One-shot: apply migrations, then exit. Other services wait on completion.
  migrate:
    build: api
    command: ["migrate"]
    container_name: event-central-api-migrate
    restart: never
    environment: 
      <<: *api-env
    secrets: *api-secrets
    depends_on:
      db:
        condition: service_healthy


networks:
  db-backend:
  storage-backend:
  clamav-backend:

volumes:
  db-data:
  storage-primary-data:
  storage-secondary-data:
