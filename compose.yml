# Production stack.
#
# Secrets are provided as files under ./secrets (dev placeholders included).

name: event-central

# Only non-sensitive configuration lives here; secrets are mounted as files.
x-api-env: &api-env
  ENVIRONMENT: production
  API_SERVICE_NAME: event-central
  LOG_LEVEL: INFO
  API_REGION: EU-01

  DB_HOST: db
  DB_PORT: 5432

  API_BASE_URL: http://eu-01.event-central.tema-dev.de
  APP_BASE_URL: http://event-central.tema-dev.de

  STORAGE_PRIMARY_ENDPOINT: "http://storage-primary:${storage_primary_port}"
  STORAGE_SECONDARY_ENDPOINT: "http://storage-secondary:${storage_secondary_port}"

  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310

# Sensitive configuration
x-api-secrets: &api-secrets
  - db_password
  - api_jwt_secret
  - api_signed_url_secret
  - storage_primary_user_key
  - storage_primary_user_secret
  - storage_secondary_user_key
  - storage_secondary_user_secret
  - api_secrets_encryption_key

secrets:
  db_password:
    file: ./secrets/db_password
  storage_root_key:
    file: ./secrets/storage_root_key
  storage_root_secret:
    file: ./secrets/storage_root_secret
  storage_primary_user_key:
    file: ./secrets/storage_primary_user_key
  storage_primary_user_secret:
    file: ./secrets/storage_primary_user_secret
  storage_secondary_user_key:
    file: ./secrets/storage_secondary_user_key
  storage_secondary_user_secret:
    file: ./secrets/storage_secondary_user_secret
  api_jwt_secret:
    file: ./secrets/api_jwt_secret
  api_signed_url_secret:
    file: ./secrets/api_signed_url_secret
  api_secrets_encryption_key:
    file: ./secrets/api_secrets_encryption_key

services:
  db:
    build: ./db
    container_name: event-central-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: event_central
      POSTGRES_DB: event_central
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - db-data:/var/lib/postgresql/data
    # ports:
    #   - "127.0.0.1:${db_port}:5432"
    networks:
      - db-backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U event_central"]
      interval: 5s
      timeout: 3s
      retries: 10
  
  storage-primary:
    build: ./storage/rustfs
    container_name: event-central-storage-primary
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:${storage_primary_port}"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:${storage_primary_console_port}"
      RUSTFS_CONSOLE_ENABLE: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export RUSTFS_ACCESS_KEY="$$(cat /run/secrets/storage_root_key)"
        export RUSTFS_SECRET_KEY="$$(cat /run/secrets/storage_root_secret)"
        exec rustfs /data
    ports:
      - "127.0.0.1:${storage_primary_port}:${storage_primary_port}"
      - "127.0.0.1:${storage_primary_console_port}:${storage_primary_console_port}"
    volumes:
      - storage-primary-data:/data
    secrets:
      - storage_root_key
      - storage_root_secret
    networks:
      - storage-backend

  storage-secondary:
    build: ./storage/rustfs
    container_name: event-central-storage-secondary
    restart: unless-stopped
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:${storage_secondary_port}"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:${storage_secondary_console_port}"
      RUSTFS_CONSOLE_ENABLE: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        export RUSTFS_ACCESS_KEY="$$(cat /run/secrets/storage_root_key)"
        export RUSTFS_SECRET_KEY="$$(cat /run/secrets/storage_root_secret)"
        exec rustfs /data
    ports:
      - "127.0.0.1:${storage_secondary_port}:${storage_secondary_port}"
      - "127.0.0.1:${storage_secondary_console_port}:${storage_secondary_console_port}"
    volumes:
      - storage-secondary-data:/data
    secrets:
      - storage_root_key
      - storage_root_secret
    networks:
      - storage-backend

  storage-init:
    build: ./storage/init
    container_name: event-central-storage-init
    restart: never
    depends_on:
      storage-primary:
        condition: service_started
      storage-secondary:
        condition: service_started
    environment:
      PRIMARY_ENDPOINT: "http://storage-primary:${storage_primary_port}"
      SECONDARY_ENDPOINT: "http://storage-secondary:${storage_secondary_port}"
      PRIMARY_CONSOLE: "http://localhost:${storage_primary_console_port}"
      SECONDARY_CONSOLE: "http://localhost:${storage_secondary_console_port}"
      BUCKETS: "event-central,invoices,backups"
    secrets:
      - storage_root_key
      - storage_root_secret
      - storage_primary_user_key
      - storage_primary_user_secret
      - storage_secondary_user_key
      - storage_secondary_user_secret
    networks:
      - storage-backend
  
  clamav:
    image: clamav/clamav:1.4 
    container_name: event-central-clamav
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav 
      - ./clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 6m # first boot downloads + loads the signature DB (~minutes)
    mem_limit: 4g
    # ports:
    #   - "127.0.0.1:${clamd_port}:3310"
    networks:
      - clamav-backend

  # Validator not running in production
  # validator-mustang:
  #   build:
  #     context: ./validator-mustang
  #     # Bump these two together to move to a newer engine; find the SHA at
  #     # https://repo1.maven.org/maven2/org/mustangproject/Mustang-CLI/
